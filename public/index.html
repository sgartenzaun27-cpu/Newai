<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Business-KI</title>
    <meta name="description" content="Kostenlose KI für Reseller: Supplier, Snipen, Shopify, Google-Badges – mit Plänen zum Abhaken." />
    <meta name="theme-color" content="#FAF8F4" />
    <meta property="og:title" content="Business-KI – kostenlos fragen" />
    <meta property="og:description" content="Supplier, Snipen, Shopify, Google-Badges: Antworten und Pläne zum Abhaken." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script src="/config.js"></script>
    <script src="/markdown.js" defer></script>
    <script src="/plan.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="kopf">
      <div class="kopf-innen">
        <a class="marke" href="/" aria-label="Business-KI, Startseite"></a>
        <div class="kopf-aktionen">
          <button class="knopf-leise plaene-knopf" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" /></svg>
            <span>Pläne</span>
            <span class="zahl" hidden></span>
          </button>
          <button class="knopf-leise neu" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span>Neu</span>
          </button>
        </div>
      </div>
    </header>

    <main class="inhalt">
      <section class="start" aria-labelledby="start-titel">
        <h1 id="start-titel"></h1>
        <p class="start-text"></p>
        <ul class="vorschlaege" aria-label="Beispielfragen"></ul>
      </section>

      <div class="verlauf" role="log" aria-live="polite" aria-label="Unterhaltung"></div>
    </main>

    <footer class="fuss">
      <form class="frage" autocomplete="off">
        <label class="unsichtbar" for="eingabe">Deine Frage</label>
        <textarea id="eingabe" rows="1" maxlength="2000" enterkeyhint="send"></textarea>
        <button class="senden" type="submit" aria-label="Frage senden" disabled></button>
      </form>
      <p class="rest" aria-live="polite"></p>
    </footer>

    <dialog class="plaene" aria-labelledby="plaene-titel">
      <div class="plaene-kopf">
        <button class="knopf-text zurueck" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
          Alle Pläne
        </button>
        <h2 id="plaene-titel">Meine Pläne</h2>
        <button class="schliessen" type="button" aria-label="Schließen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="plaene-inhalt"></div>
    </dialog>

    <noscript><p class="ohne-js">Bitte aktiviere JavaScript, um die Business-KI zu nutzen.</p></noscript>
  </body>
</html>
